name: Feature request
description: Suggest an improvement to openHUD.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today, or what is awkward.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: It can be done with the operations OmsiLaunch already offers to modules (no game internals, no input simulation).
